plugins {
    id 'dev.architectury.loom'
}

loom {
    accessWidenerPath = file('src/main/resources/ymcoloredlights.accesswidener')
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'ymcoloredlights-refmap.json'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }

    // Mixin annotations - provided by fabric-loader; needed for common compilation
    modCompileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}")

    // YM Duct Tape (creative tab, YM GUI kit), required mod; the jar is kept in libs/
    modCompileOnly fileTree('../libs') { include 'ymducttape-v*-fabric-*.jar'; exclude '*-dev.jar' }

    // Veil - common artifact provides the cross-loader API surface
    modCompileOnly("foundry.veil:veil-common-${minecraft_version}:${veil_version}") {
        exclude group: 'maven.modrinth'
        exclude group: 'me.fallenbreath'
        transitive = false
    }
}
